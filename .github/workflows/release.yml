name: Release

# Publishes bisim.py to PyPI when a tag v<version> is pushed (for example v0.1.0), then creates a GitHub
# release with the same files.
#
# This uses PyPI trusted publishing (OIDC): no PyPI token is stored anywhere. Before the first release, add a
# trusted publisher on pypi.org (a "pending publisher" while the project does not exist yet) of type GitHub with
#   owner:             bisim-gg
#   repository:        bisim.py
#   workflow filename: release.yml
#   environment:       pypi
# and create the environment "pypi" in this repository's settings. Without that, the publish step is refused.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version ${version} in pyproject.toml" >&2
            exit 1
          fi
          if ! grep -q "^__version__ = '${version}'" bisim/__init__.py; then
            echo "bisim/__init__.py does not say __version__ = '${version}'" >&2
            exit 1
          fi

      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bisim.py/
    permissions:
      id-token: write # lets PyPI verify this workflow (trusted publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "bisim.py ${GITHUB_REF_NAME#v}"
          --generate-notes
