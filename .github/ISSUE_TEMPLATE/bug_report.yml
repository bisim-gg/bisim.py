name: Bug report
description: Something in bisim.py does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include your bot token or any other secret.
        Security problems go to security@bisim.gg instead.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code to reproduce it
      description: The smallest piece of code that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and traceback
      description: Paste the full traceback, if there is one.
      render: text
  - type: input
    id: version
    attributes:
      label: bisim.py version
      description: The output of `python -c "import bisim; print(bisim.__version__)"`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: '3.12.4'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15
  - type: dropdown
    id: discordpy
    attributes:
      label: Does the same code work with discord.py on Discord?
      options:
        - 'Yes'
        - 'No'
        - I have not tried
